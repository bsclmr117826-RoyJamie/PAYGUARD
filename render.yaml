# Render Blueprint Configuration for PayGuard
# Free Plan Setup (Django + PostgreSQL)

services:
  # ---------------------------------------------------------------------------
  # 1. Django Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: payguard-web
    env: python
    region: oregon # Options: oregon, frankfurt, singapore, ohio
    plan: free
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn payguard.wsgi:application --bind 0.0.0.0:$PORT"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: payguard.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: payguard-db
          property: connectionString

databases:
  # ---------------------------------------------------------------------------
  # 2. Managed PostgreSQL Database
  # ---------------------------------------------------------------------------
  - name: payguard-db
    databaseName: payguard
    user: payguard_user
    plan: free
    region: oregon
