{% extends "base.html" %}
{% block title %}Register repository | PayGuard{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Register repository</h1>
<form method="post" class="card card-body shadow-sm" style="max-width: 560px">
  {% csrf_token %}
  {{ form.as_p }}
  <div><button class="btn btn-primary" type="submit">Save</button>
  <a class="btn btn-link" href="{% url 'repos:list' %}">Cancel</a></div>
</form>
{% endblock %}
