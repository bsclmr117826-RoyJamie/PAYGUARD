{% extends "base.html" %}
{% block title %}Log in | PayGuard{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body">
      <h1 class="h4 mb-3">Log in to PayGuard</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Log in</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
